name: images

# Publishes browser-base and the video recorder. Neither follows a commit, so
# only a release tag naming one of them builds anything:
#   browser-base-1.0.1     -> websummoner/browser-base
#   video-recorder-1.2.0   -> websummoner/video-recorder
# Every other tag, and every push, is ignored.

on:
  push:
    tags:
      - 'browser-base-*'
      - 'video-recorder-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'browser-base-<version> or video-recorder-<version>'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: ci/docker-push.sh "${{ inputs.tag || github.ref_name }}"
